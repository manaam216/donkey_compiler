name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux x86-64 (full)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build
        run: make

      # The primary job: Donkey emits x86-64 System V assembly, so this is the
      # platform that can assemble it, link it against the system libc, and run
      # the results.
      - name: Test
        run: make test

  windows:
    name: Windows i686 (compile only)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            make
            diffutils
            mingw-w64-i686-gcc

      - name: Build
        run: make

      # A 32-bit MinGW toolchain cannot assemble x86-64 System V output, so
      # this job compiles every example, diffs the golden assembly, and checks
      # every diagnostic. Its value is catching portability bugs in the
      # compiler's own source.
      - name: Test (compile only)
        run: SKIP_RUN=1 make test

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test with sanitizers
        env:
          CFLAGS: -Wall -Wextra -g -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        # Leak detection is off for now: the globals and strings tables in
        # codegen.c leak by design, and every exit() path abandons the AST.
        run: make test
